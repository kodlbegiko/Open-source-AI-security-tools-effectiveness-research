name: Annotated tag target probe

on:
  push:
    branches: [research/effectiveness-study]
    paths:
      - '.github/workflows/release-status-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_OBJECT_SHA: ddd2c53ac3954923b18003cd8c915f3ee0a7810a
      MERGE_SHA: 21fc314d170762392ec2ae1ea3595c4d6da9b037
    steps:
      - name: Checkout research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/effectiveness-study
          persist-credentials: true

      - name: Resolve and verify annotated tag target
        run: |
          set -euo pipefail
          mkdir -p evidence/diagnostics
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" > evidence/diagnostics/tag-target.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          tag = json.loads(Path('evidence/diagnostics/tag-target.json').read_text())
          assert tag['sha'] == os.environ['TAG_OBJECT_SHA']
          assert tag['tag'] == 'research-v0.1.0'
          assert tag['object']['type'] == 'commit'
          assert tag['object']['sha'] == os.environ['MERGE_SHA']
          Path('evidence/diagnostics/tag-target.json').write_text(json.dumps({
              'annotated_tag_sha': tag['sha'],
              'tag': tag['tag'],
              'message': tag['message'],
              'target_type': tag['object']['type'],
              'target_sha': tag['object']['sha'],
              'tagger_date': tag['tagger']['date'],
              'verified': True,
          }, indent=2, sort_keys=True) + '\n')
          print(Path('evidence/diagnostics/tag-target.json').read_text())
          PY

      - name: Commit tag target evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/diagnostics/tag-target.json
          git diff --cached --check
          git commit -m 'chore: verify annotated research tag target'
          git push origin HEAD:research/effectiveness-study
