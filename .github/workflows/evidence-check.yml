name: Evidence consistency

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify repository checksums
        run: |
          set -euo pipefail
          sha256sum -c evidence/checksums/SHA256SUMS

      - name: Validate evidence manifest and report consistency
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('evidence/evidence-manifest.json').read_text())
          metrics = json.loads(Path('results/metrics/metrics.json').read_text())
          summary = json.loads(Path('generated/benchmark/summary.json').read_text())

          assert manifest['benchmark_manifest_sha256'] == summary['manifest_sha256']
          assert manifest['formal_run_id']
          assert manifest['protocol_freeze_commit']
          assert manifest['independent_review'] == 'NOT_AVAILABLE'
          assert metrics['primary_comparison'] == 'gitleaks versus keyword-regex-baseline'

          for record in manifest['files']:
              path = Path(record['path'])
              assert path.is_file(), path
              assert path.stat().st_size == record['bytes'], path
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == record['sha256'], path

          final = Path('reports/final-report.md').read_text()
          executive = Path('reports/executive-summary.md').read_text()
          assert summary['manifest_sha256'] in final
          assert summary['manifest_sha256'] in executive
          assert 'Independent review: **NOT AVAILABLE**' in final
          assert 'Independent review: **NOT AVAILABLE**' in executive
          print(json.dumps({'manifest_files': len(manifest['files']), 'checks': 'passed'}))
          PY

      - name: Ensure prohibited rendered fixtures are absent from repository history tree
        run: |
          set -euo pipefail
          test ! -d generated/benchmark/cases
          test ! -e results/raw/detect-secrets.json
          git ls-files | grep -E '^generated/benchmark/cases/' && exit 1 || true
          git ls-files | grep -E '^results/raw/' && exit 1 || true
