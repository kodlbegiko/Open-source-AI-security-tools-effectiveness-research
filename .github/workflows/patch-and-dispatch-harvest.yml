name: Patch reporting newline and dispatch harvest

on:
  push:
    branches: [research/effectiveness-study]
    paths:
      - '.github/workflows/patch-and-dispatch-harvest.yml'

permissions:
  actions: write
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/effectiveness-study
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact source fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          reporting = Path('reporting/build_reports.py')
          text = reporting.read_text()
          old = 'writer = csv.DictWriter(handle, fieldnames=list(claim_rows[0]))'
          new = 'writer = csv.DictWriter(handle, fieldnames=list(claim_rows[0]), lineterminator="\\n")'
          assert text.count(old) == 1, text.count(old)
          reporting.write_text(text.replace(old, new))

          evidence = Path('.github/workflows/evidence-check.yml')
          text = evidence.read_text()
          replacements = {
              "run = json.loads(Path('evidence/formal-run/run.json').read_text())['selection']": "run = json.loads(Path('evidence/formal-run/run.json').read_text())",
              "assert artifact['workflow_run_id'] == str(run['id'])": "assert artifact['workflow_run']['id'] == run['id']",
              "assert artifact['execution_head_sha'] == run['head_sha']": "assert artifact['authoritative_execution_sha'] == run['head_sha']",
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new)
          evidence.write_text(text)

          self_path = Path('.github/workflows/patch-and-dispatch-harvest.yml')
          assert self_path.is_file()
          self_path.unlink()
          PY

      - name: Validate patched sources
        run: |
          set -euo pipefail
          python -m compileall -q reporting
          python - <<'PY'
          import csv
          import io
          buffer = io.StringIO(newline='')
          writer = csv.DictWriter(buffer, fieldnames=['a'], lineterminator='\n')
          writer.writeheader()
          writer.writerow({'a': 'x'})
          assert buffer.getvalue() == 'a\nx\n'
          print('CSV_LF_VALIDATED')
          PY
          git diff --check

      - name: Commit source fixes and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reporting/build_reports.py .github/workflows/evidence-check.yml .github/workflows/patch-and-dispatch-harvest.yml
          git diff --cached --check
          git commit -m 'fix: normalize report CSV and evidence identity parsing'
          git push origin HEAD:research/effectiveness-study

      - name: Dispatch identity-locked authoritative harvest
        run: |
          set -euo pipefail
          gh workflow run harvest-authoritative.yml --ref research/effectiveness-study
          echo 'AUTHORITATIVE_HARVEST_DISPATCHED'
