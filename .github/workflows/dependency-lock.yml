name: Dependency lock evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'

      - name: Download exact wheels
        run: |
          set -euo pipefail
          mkdir -p evidence/dependency-lock/wheels
          python -m pip download \
            --only-binary=:all: \
            --dest evidence/dependency-lock/wheels \
            'detect-secrets==1.5.0' \
            'PyYAML==6.0.3' \
            'requests==2.34.2' \
            'charset-normalizer==3.4.9' \
            'idna==3.18' \
            'urllib3==2.7.0' \
            'certifi==2026.7.22'
          find evidence/dependency-lock/wheels -type f -print0 | sort -z | xargs -0 sha256sum \
            > evidence/dependency-lock/wheel-SHA256SUMS
          cat evidence/dependency-lock/wheel-SHA256SUMS

      - name: Verify wheel digests against PyPI metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          wheel_dir = Path('evidence/dependency-lock/wheels')
          packages = {
              'detect-secrets': '1.5.0',
              'PyYAML': '6.0.3',
              'requests': '2.34.2',
              'charset-normalizer': '3.4.9',
              'idna': '3.18',
              'urllib3': '2.7.0',
              'certifi': '2026.7.22',
          }
          records = []
          for package, version in packages.items():
              url = f'https://pypi.org/pypi/{package}/{version}/json'
              request = urllib.request.Request(url, headers={'User-Agent': 'ai-security-research/0.1'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  metadata = json.load(response)
              by_name = {item['filename']: item for item in metadata['urls']}
              normalized = package.lower().replace('-', '_')
              candidates = [
                  path for path in wheel_dir.glob('*.whl')
                  if path.name.lower().replace('-', '_').startswith(normalized + '_')
                  or path.name.lower().replace('-', '_').startswith(normalized + '-')
              ]
              if len(candidates) != 1:
                  raise SystemExit(f'{package}: expected one wheel, found {[p.name for p in candidates]}')
              path = candidates[0]
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = by_name[path.name]['digests']['sha256']
              if actual != expected:
                  raise SystemExit(f'{path.name}: digest mismatch')
              records.append({
                  'package': package,
                  'version': version,
                  'filename': path.name,
                  'sha256': actual,
                  'pypi_verified': True,
              })
          Path('evidence/dependency-lock/lock.json').write_text(
              json.dumps({'python': '3.13.14', 'artifacts': records}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(records, indent=2, sort_keys=True))
          PY

      - name: Offline installation smoke test
        run: |
          set -euo pipefail
          python -m venv /tmp/detect-secrets-venv
          /tmp/detect-secrets-venv/bin/pip install \
            --no-index \
            --find-links evidence/dependency-lock/wheels \
            'detect-secrets==1.5.0'
          /tmp/detect-secrets-venv/bin/detect-secrets --version \
            | tee evidence/dependency-lock/offline-install-version.txt
          test "$(cat evidence/dependency-lock/offline-install-version.txt)" = '1.5.0'

      - name: Create evidence checksum
        if: always()
        run: |
          set -euo pipefail
          root=evidence/dependency-lock
          find "$root" -type f ! -path '*/wheels/*' ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS"

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-lock-evidence
          path: evidence/dependency-lock
          if-no-files-found: error
          retention-days: 30
