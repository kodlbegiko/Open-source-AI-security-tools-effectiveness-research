name: Redaction compatibility preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/redaction-compatibility.yml'
      - 'scripts/redact_gitleaks.py'
      - 'scripts/redact_trufflehog.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Acquire pinned scanners
        run: |
          set -euo pipefail
          mkdir -p /tmp/tools/gitleaks /tmp/tools/trufflehog /tmp/fixture
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/tools/gitleaks
          curl -fsSL https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0/trufflehog_3.96.0_linux_amd64.tar.gz -o /tmp/trufflehog.tar.gz
          echo '7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0  /tmp/trufflehog.tar.gz' | sha256sum -c -
          tar -xzf /tmp/trufflehog.tar.gz -C /tmp/tools/trufflehog

      - name: Generate synthetic fixture
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          value = 'gh' + 'p_' + hashlib.sha256(b'redaction-preflight').hexdigest()[:36]
          Path('/tmp/fixture/sample.txt').write_text('github_token = ' + value + '\n')
          PY

      - name: Verify structural redaction
        run: |
          set -euo pipefail
          /tmp/tools/gitleaks/gitleaks dir /tmp/fixture --no-banner --exit-code 0 --redact=100 --report-format json --report-path /tmp/gitleaks-unredacted.json
          /tmp/tools/trufflehog/trufflehog filesystem /tmp/fixture --no-verification --json > /tmp/trufflehog-unredacted.jsonl
          python scripts/redact_gitleaks.py --input /tmp/gitleaks-unredacted.json --output /tmp/gitleaks-redacted.json
          python scripts/redact_trufflehog.py --input /tmp/trufflehog-unredacted.jsonl --output /tmp/trufflehog-redacted.jsonl
          rm -f /tmp/gitleaks-unredacted.json /tmp/trufflehog-unredacted.jsonl
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          token = 'gh' + 'p_' + hashlib.sha256(b'redaction-preflight').hexdigest()[:36]
          gitleaks = json.loads(Path('/tmp/gitleaks-redacted.json').read_text())
          trufflehog = [json.loads(line) for line in Path('/tmp/trufflehog-redacted.jsonl').read_text().splitlines() if line.strip()]
          assert gitleaks, 'Gitleaks produced no finding'
          assert trufflehog, 'TruffleHog produced no finding'
          serialized = json.dumps({'gitleaks': gitleaks, 'trufflehog': trufflehog}, sort_keys=True)
          assert token not in serialized, 'exact synthetic token remains in retained output'
          assert all('Secret' not in record and 'Match' not in record for record in gitleaks)
          assert any(record.get('Raw') == '[REDACTED]' for record in trufflehog)
          assert all(record.get('RawV2') == '[REDACTED]' for record in trufflehog if 'RawV2' in record)
          print(json.dumps({'gitleaks_findings': len(gitleaks), 'trufflehog_findings': len(trufflehog), 'exact_raw_token_absent': True}))
          PY
