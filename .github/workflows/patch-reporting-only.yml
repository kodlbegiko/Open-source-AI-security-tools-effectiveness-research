name: Patch reporting CSV and dispatch harvest

on:
  push:
    branches: [research/effectiveness-study]
    paths:
      - '.github/workflows/patch-reporting-only.yml'

permissions:
  actions: write
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/effectiveness-study
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize generated CSV line endings at source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('reporting/build_reports.py')
          text = path.read_text()
          old = 'writer = csv.DictWriter(handle, fieldnames=list(claim_rows[0]))'
          new = 'writer = csv.DictWriter(handle, fieldnames=list(claim_rows[0]), lineterminator="\\n")'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new))
          PY
          python -m compileall -q reporting
          git diff --check

      - name: Commit reporting source fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reporting/build_reports.py
          git diff --cached --check
          git commit -m 'fix: emit claim verification CSV with LF endings'
          git push origin HEAD:research/effectiveness-study

      - name: Dispatch identity-locked authoritative harvest
        run: |
          set -euo pipefail
          gh workflow run harvest-authoritative.yml --ref research/effectiveness-study
          echo 'AUTHORITATIVE_HARVEST_DISPATCHED'
