name: Formal effectiveness evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - 'research-manifest.yml'
      - 'docs/protocol.md'
      - 'docs/preregistration.md'
      - 'benchmark/**'
      - 'baselines/**'
      - 'adapters/**'
      - 'analysis/**'
      - 'scripts/run_evaluation.sh'
      - 'scripts/redact_gitleaks.py'
      - 'scripts/redact_trufflehog.py'
      - 'requirements.lock'
      - '.github/workflows/evaluation.yml'
      - 'evidence/protocol-freeze.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout frozen research tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up frozen Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'

      - name: Record execution environment
        run: |
          set -euo pipefail
          mkdir -p evidence/evaluation tools/gitleaks tools/trufflehog
          {
            echo "utc_time=$(date -u +%FT%TZ)"
            echo "github_sha=${GITHUB_SHA}"
            echo "github_run_id=${GITHUB_RUN_ID}"
            uname -a
            cat /etc/os-release
            lscpu
            free -h
            df -h
            python --version
            git --version
          } | tee evidence/evaluation/runner-environment.txt

      - name: Install hash-locked detect-secrets environment
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          .venv/bin/detect-secrets --version | tee evidence/evaluation/detect-secrets-version.txt
          test "$(cat evidence/evaluation/detect-secrets-version.txt)" = '1.5.0'
          .venv/bin/python -m pip freeze | sort > evidence/evaluation/python-freeze.txt

      - name: Acquire and verify pinned scanner binaries
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C tools/gitleaks
          chmod +x tools/gitleaks/gitleaks
          tools/gitleaks/gitleaks version | tee evidence/evaluation/gitleaks-version.txt

          curl -fsSL https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0/trufflehog_3.96.0_linux_amd64.tar.gz -o /tmp/trufflehog.tar.gz
          echo '7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0  /tmp/trufflehog.tar.gz' | sha256sum -c -
          tar -xzf /tmp/trufflehog.tar.gz -C tools/trufflehog
          chmod +x tools/trufflehog/trufflehog
          tools/trufflehog/trufflehog --version | tee evidence/evaluation/trufflehog-version.txt
          rm -f /tmp/gitleaks.tar.gz /tmp/trufflehog.tar.gz

      - name: Verify frozen source before formal execution
        run: |
          set -euo pipefail
          python -m compileall -q adapters analysis baselines benchmark scripts tests
          bash -n scripts/run_evaluation.sh
          python -m unittest discover -s tests -v 2>&1 | tee evidence/evaluation/pre-execution-tests.txt

      - name: Run formal evaluation once
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/tools/gitleaks/gitleaks
          TRUFFLEHOG_BIN: ${{ github.workspace }}/tools/trufflehog/trufflehog
          DETECT_SECRETS_BIN: ${{ github.workspace }}/.venv/bin/detect-secrets
        run: |
          set -euo pipefail
          bash scripts/run_evaluation.sh

      - name: Validate manifest, cardinality and retained evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('generated/benchmark/summary.json').read_text())
          assert summary['manifest_sha256'] == '38059b47ea3b8217df38b90a4525286a18ca37b7bc136cfbbce5227aa6f54e27'
          assert summary['total'] == 780
          assert summary['splits'] == {'development': 60, 'pilot': 60, 'confirmatory': 480, 'out-of-distribution': 180}
          assert summary['languages'] == {'en': 260, 'zh-TW': 260, 'mixed': 260}
          assert summary['labels'] == {'SAFE': 390, 'UNSAFE': 390}

          expected_tools = {'no-security-tool', 'keyword-regex-baseline', 'gitleaks', 'trufflehog', 'detect-secrets'}
          for tool in expected_tools:
              rows = [json.loads(line) for line in (Path('results/normalized') / f'{tool}.jsonl').read_text().splitlines() if line.strip()]
              assert len(rows) == 780, (tool, len(rows))
              assert {row['tool'] for row in rows} == {tool}

          metrics = json.loads(Path('results/metrics/metrics.json').read_text())
          assert metrics['primary_comparison'] == 'gitleaks versus keyword-regex-baseline'
          assert set(metrics['primary_analysis']) == {'gitleaks'}
          assert set(metrics['secondary_analysis']) == {'trufflehog', 'detect-secrets'}

          gitleaks = json.loads(Path('results/raw/gitleaks.json').read_text())
          gitleaks_allowed = {'Description', 'StartLine', 'EndLine', 'StartColumn', 'EndColumn', 'File', 'SymlinkFile', 'Commit', 'Entropy', 'Author', 'Email', 'Date', 'Message', 'Tags', 'RuleID', 'Fingerprint'}
          assert all(set(record) <= gitleaks_allowed for record in gitleaks)
          assert all('Secret' not in record and 'Match' not in record for record in gitleaks)

          trufflehog = [json.loads(line) for line in Path('results/raw/trufflehog.jsonl').read_text().splitlines() if line.strip()]
          allowed = {'DetectorType', 'DetectorName', 'DecoderName', 'Verified', 'SourceMetadata'}
          for record in trufflehog:
              assert set(record) <= allowed
              assert not ({'Raw', 'RawV2', 'ExtraData', 'VerificationError'} & set(record))
              filesystem = record.get('SourceMetadata', {}).get('Data', {}).get('Filesystem', {})
              assert set(filesystem) <= {'file'}

          print(json.dumps({'manifest_verified': True, 'normalized_rows_per_condition': 780, 'primary_comparison_verified': True, 'retained_scanner_outputs_whitelist_only': True}, indent=2, sort_keys=True))
          PY

      - name: Verify evidence checksums
        run: |
          set -euo pipefail
          sha256sum -c evidence/evaluation/SHA256SUMS

      - name: Upload immutable evaluation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-evaluation-${{ github.sha }}
          path: |
            generated/benchmark
            results
            evidence/evaluation
          if-no-files-found: error
          retention-days: 90
