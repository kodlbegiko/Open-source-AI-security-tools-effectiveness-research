name: One-time precision patch repair

on:
  push:
    branches: [research/effectiveness-study]
    paths:
      - '.github/workflows/repair-precision-patch.yml'
      - '.github/precision-patch.tar.gz'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout research branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/effectiveness-study
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and extract patch
        run: |
          set -euo pipefail
          echo 'a88a26897cee5aa6eb95c5092715d8213bb90fc2678f0c85e8649157d3374e33  .github/precision-patch.tar.gz' | sha256sum -c -
          tar -xzf .github/precision-patch.tar.gz -C .
          test "$(git hash-object benchmark/generate_benchmark.py)" = '8e4e171cdfcfdeea433012134f8d0c155d1a4359'

      - name: Validate repaired files
        run: |
          set -euo pipefail
          python -m compileall -q adapters analysis baselines benchmark scripts tests
          bash -n scripts/run_evaluation.sh
          python -m unittest discover -s tests -v
          python benchmark/generate_benchmark.py --output /tmp/repaired-benchmark
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/repaired-benchmark/summary.json').read_text())
          assert summary['total'] == 780
          assert summary['splits']['confirmatory'] == 480
          assert summary['splits']['out-of-distribution'] == 180
          assert summary['languages'] == {'en': 260, 'zh-TW': 260, 'mixed': 260}
          assert summary['labels'] == {'SAFE': 390, 'UNSAFE': 390}
          assert summary['manifest_sha256'] == '38059b47ea3b8217df38b90a4525286a18ca37b7bc136cfbbce5227aa6f54e27'
          PY

      - name: Commit repaired source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark/generate_benchmark.py tests/test_research_pipeline.py .github/workflows/tests.yml
          git diff --cached --check
          git commit -m 'research: increase confirmatory precision target'
          git push origin HEAD:research/effectiveness-study
